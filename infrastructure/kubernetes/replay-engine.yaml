apiVersion: apps/v1
kind: Deployment
metadata:
  name: replay-engine
spec:
  replicas: 2
  selector:
    matchLabels:
      app: replay-engine
  template:
    metadata:
      labels:
        app: replay-engine
    spec:
      containers:
        - name: replay-engine
          image: institutional-ai-runtime/replay-engine:latest
          ports:
            - containerPort: 8080
