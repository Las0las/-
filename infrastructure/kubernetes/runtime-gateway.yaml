apiVersion: apps/v1
kind: Deployment
metadata:
  name: runtime-gateway
spec:
  replicas: 2
  selector:
    matchLabels:
      app: runtime-gateway
  template:
    metadata:
      labels:
        app: runtime-gateway
    spec:
      containers:
        - name: runtime-gateway
          image: institutional-ai-runtime/runtime-gateway:latest
          ports:
            - containerPort: 8080
