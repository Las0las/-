apiVersion: apps/v1
kind: Deployment
metadata:
  name: deployment-health
spec:
  replicas: 2
  selector:
    matchLabels:
      app: deployment-health
  template:
    metadata:
      labels:
        app: deployment-health
    spec:
      containers:
        - name: deployment-health
          image: institutional-ai-runtime/deployment-health:latest
          ports:
            - containerPort: 8080
