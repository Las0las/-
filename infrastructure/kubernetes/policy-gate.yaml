apiVersion: apps/v1
kind: Deployment
metadata:
  name: policy-gate
spec:
  replicas: 2
  selector:
    matchLabels:
      app: policy-gate
  template:
    metadata:
      labels:
        app: policy-gate
    spec:
      containers:
        - name: policy-gate
          image: institutional-ai-runtime/policy-gate:latest
          ports:
            - containerPort: 8080
